<style>

.lt{top:104px;left:0;right:0;text-align:center;font-size:112px;font-weight:600;letter-spacing:-3px;line-height:1;font-family:'SF Pro Rounded',-apple-system,'Helvetica Neue',sans-serif}
#ldate{top:79px;left:0;right:0;text-align:center;font-size:21px;font-weight:600}

#lbar{top:840px;left:127px;width:140px;height:5px;border-radius:3px;background:#fff;cursor:pointer}

.rt{display:flex;align-items:center;gap:6px;height:20px}

#pass{position:absolute;inset:0;z-index:44;background:#524c43;color:#fff}
.pc{position:absolute;inset:0;opacity:var(--p,0);transition:opacity .3s}
.pt{position:absolute;top:150px;left:0;right:0;text-align:center;font-size:21px;font-weight:500}
.dots{position:absolute;top:197px;left:134px;display:flex;gap:24px}.dots i{width:13px;height:13px;border:1.5px solid #fff;border-radius:50%;box-sizing:border-box}.dots i.f{background:#fff}
.shake{animation:shk .5s}@keyframes shk{0%,100%{transform:none}15%{transform:translateX(-13px)}30%{transform:translateX(12px)}45%{transform:translateX(-10px)}60%{transform:translateX(8px)}75%{transform:translateX(-4px)}90%{transform:translateX(2px)}}
.keys{position:absolute;left:56px;top:293px;display:grid;grid-template-columns:repeat(3,78px);gap:18px 23px}
.k{width:78px;height:78px;border-radius:50%;background:#a9a9a9;border:.5px solid #2b2926;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;font-weight:300;line-height:1;transition:background .45s,color .45s;cursor:pointer}
.k small{font-size:8px;font-weight:700;letter-spacing:2.5px;height:10px;margin-top:2px;line-height:10px}.k.on{background:#e9e9e9;color:#666;transition:none}
.bl{position:absolute;top:771px;width:100px;margin-left:-50px;text-align:center;font-size:17px;cursor:pointer}
@keyframes igfill{from{width:0}to{width:100%}}
</style></head><body>
<div id="stage"><div id="phone">
<div id="sb"><span class="clk"></span><span class="rt" data-r="2"></span></div><div id="di"><svg class="li" width="18" height="22" viewBox="0 0 18 22"><rect x="1" y="9" width="16" height="12" rx="3" fill="#d4d4d4"/><path d="M4.500 9V6a4.500 4.500 0 019 0v3" fill="none" stroke="#d4d4d4" stroke-width="2.600"/></svg><svg class="fi" width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#9fe6a4" stroke-width="2" stroke-linecap="round"><path d="M2 8V5a3 3 0 013-3h3M18 2h3a3 3 0 013 3v3M24 18v3a3 3 0 01-3 3h-3M8 24H5a3 3 0 01-3-3v-3"/><path d="M9 9v2M17 9v2M13 9v4.500h-1.500M9 17q4 3 8 0"/></svg></div><div id="bar" onclick="closeApp()"></div>

<div class="lb" style="left:46px"><svg width="22" height="30" viewBox="0 0 22 30" fill="#f5eee6"><path d="M4 0h14v6l-3 3v3H7V9L4 6z"/><rect x="7" y="13" width="8" height="17" rx="3"/></svg></div>

<div id="lbar"></div></div>

<script>
/* ===== 여기만 고치면 내용이 바뀝니다 ===== */
const DATA={
 calls:[["엄마","발신 · 3분","오늘"],["친구1","부재중","오늘"],["택배기사","수신 · 1분","어제"],["친구2","발신 · 12분","어제"],["010-1234-5678","부재중","월요일"]],

  {name:"채팅방 2",msgs:[[0,"사진 보냈어"],[1,"오 잘 나왔다"]]},
  {name:"채팅방 3",msgs:[[1,"내일 몇 시에 만나?"],[0,"2시 어때"]]},
  {name:"채팅방 4",msgs:[[0,"고마워!"],[1,"천만에"]]},
  {name:"채팅방 5",msgs:[[0,"주말에 시간 돼?"],[1,"응 괜찮아"]]}],
 gifts:[["☕","스타벅스","아메리카노 Tall","2026.12.31"],["🍰","투썸플레이스","케이크 교환권","2026.11.30"],["🍗","BHC","치킨 기프티콘","2027.01.15"]],

};
/* ======================================== */
const $=s=>document.querySelector(s),phone=$('#phone');
const icons={
 cal:["캘린더","#fff","🗓️"],photos:["사진","#fff","🌸"],some:["썸원","#ff6b8b","💕"],music:["음악","linear-gradient(#fa5c7c,#fc3c44)","🎵"],
 phone:["전화","#34c759","📞"],msg:["문자","#34c759","💬"],kakao:["카카오톡","#fee500","💛"],insta:["Instagram","linear-gradient(45deg,#f9a03c,#e1306c,#833ab4)",'<svg viewBox="0 0 48 48" width="34" height="34"><rect x="4" y="4" width="40" height="40" rx="13" fill="none" stroke="#fff" stroke-width="3.2"/><circle cx="24" cy="24" r="10" fill="none" stroke="#fff" stroke-width="3.2"/><circle cx="35" cy="13" r="2.3" fill="#fff"/></svg>']};
const mk=k=>`<div class="ic" onclick="openApp('${k}',this.querySelector('i'))"><i style="background:${icons[k][1]}">${icons[k][2]}</i>${$('#dock').contains?'':''}<span>${icons[k][0]}</span></div>`;
$('#grid').innerHTML=['cal','photos','some','music'].map(mk).join('')+
 `<div class="ic fold"><i><b style="background:#111"></b><b style="background:#6a3df0"></b><b style="background:#ffd23f"></b><b style="background:#ff7a1a"></b></i><span>쇼핑</span></div>`;
$('#dock').innerHTML=['phone','msg','kakao','insta'].map(k=>mk(k).replace(/<span>.*?<\/span>/,'')).join('');

const IGDATA={stories:[['민지야놀자',1,'17시간'],['soo_young99',0,'9시간'],['daily.jh',0,'1일'],['hana_log',0,'2일'],['yoon.archive',0,'2일']],
 posts:[['user_minji','오늘 하루도 기록 ✨',['오 분위기 좋다','나도 가고싶다']],['user_sooyoung','맛집 발견 🍜',['여기 어디예요?','저장했어요']],['user_daily','오랜만에 산책',['날씨 진짜 좋다','댕댕이 귀여워']],['user_hana','새로운 취미 시작',['화이팅!!','나도 해보고싶어']],['user_yoon','주말 브이로그',['꿀잼ㅋㅋ','다음편 기대']],['user_cafe','카페에서 ☕',['분위기 좋다','위치 공유 가능?']]],
 dms:['지은','현우','수민','민재','소연','다은','준서','하율']};
const IG={tab:'home',story:null,dm:null,liked:new Set(),storyLiked:new Set(),cmt:null};
function igOpen(fn){fn();ap.innerHTML=igMain()}
function igStoryFace(i,live,frozenPct){const s=IGDATA.stories[i];
 const prog=live?`<div id="storyfill" style="height:100%;background:#fff;width:0;animation:igfill 4s linear forwards" onanimationend="igStoryNext()"></div>`:`<div style="height:100%;background:#fff;width:${frozenPct||'0%'}"></div>`;
 return `<div style="position:absolute;inset:0;background:linear-gradient(160deg,${s[1]?'#1c5':'#8134af'},#222)">
  <div style="position:absolute;top:50px;left:10px;right:10px;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;z-index:2">${prog}</div>
  <div style="position:absolute;top:60px;left:14px;right:14px;display:flex;align-items:center;gap:8px;color:#fff;z-index:2">
   <div style="width:30px;height:30px;border-radius:50%;background:#cfd6e4;border:1px solid rgba(255,255,255,.4)"></div>
   <b style="font-size:14px">${s[0]}</b><span style="font-size:13px;color:rgba(255,255,255,.75)">${s[2]}</span>
   <div style="flex:1"></div>
   ${s[1]?'<div style="display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.15);padding:3px 8px 3px 6px;border-radius:14px;font-size:12px"><span style="color:#3ad37d">★</span>친한친구 ⌄</div>':''}
   <span style="font-size:19px">≡</span>
   <span${live?' onclick="igOpen(()=>IG.story=null)"':''} style="font-size:22px;cursor:pointer;padding:4px">✕</span>
  </div>
  <div style="position:absolute;left:14px;right:14px;bottom:28px;display:flex;align-items:center;gap:14px;z-index:2">
   <div style="flex:1;border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:10px 16px;color:rgba(255,255,255,.75);font-size:14px">메시지 보내기...</div>
   <span${live?` onclick="igStoryLike(${i})"`:''} style="font-size:24px;cursor:pointer;color:${IG.storyLiked.has(i)?'#ed4956':'#fff'}">${IG.storyLiked.has(i)?'♥':'♡'}</span>
  </div>
 </div>`}
function igStorySlide(dir,fn){const nextI=IG.story+dir;
 if(nextI<0)return;
 if(nextI>=IGDATA.stories.length){igOpen(()=>IG.story=null);return}
 const box=document.getElementById('storybox');if(!box){fn();igOpen(()=>{});return}
 const half=196.5,curI=IG.story;
 const fillEl=document.getElementById('storyfill');let curPct='0%';
 if(fillEl){const pw=fillEl.parentElement.getBoundingClientRect().width;curPct=(parseFloat(getComputedStyle(fillEl).width)/pw*100)+'%'}
 const sideT=dir>0?`rotateY(90deg) translateZ(${half}px)`:`rotateY(-90deg) translateZ(${half}px)`;
 box.innerHTML=`<div id="cube" style="position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.4,.05,.2,1);transform:rotateY(0deg)">
  <div style="position:absolute;inset:0;backface-visibility:hidden;transform:translateZ(${half}px)">${igStoryFace(curI,false,curPct)}</div>
  <div style="position:absolute;inset:0;backface-visibility:hidden;transform:${sideT}">${igStoryFace(nextI,false)}</div>
 </div>`;
 const cube=document.getElementById('cube');cube.getBoundingClientRect();
 requestAnimationFrame(()=>{cube.style.transform=`rotateY(${dir>0?-90:90}deg)`});
 setTimeout(()=>{fn();ap.innerHTML=igMain()},620)}
function igStoryNext(){if(IG.story==null)return;igStorySlide(1,()=>{IG.story++})}
function igStoryPrev(){if(IG.story==null)return;igStorySlide(-1,()=>{IG.story--})}
function igStoryLike(i){IG.storyLiked.has(i)?IG.storyLiked.delete(i):IG.storyLiked.add(i);igOpen(()=>{})}
function igLike(i){IG.liked.has(i)?IG.liked.delete(i):IG.liked.add(i);igOpen(()=>{})}
const ICN={home:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9.5"/></svg>',
 reels:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M10 8.3v7.4l6.2-3.7-6.2-3.7z" fill="#111" stroke="none"/></svg>',
 dm:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 2.5 10.7c-.8.3-.8 1.4 0 1.7l6.9 2.7 2.7 6.9c.3.8 1.4.8 1.7 0L22 3z"/><path d="M22 3 9.5 15.4"/></svg>',
 search:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
 profile:'<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="10" fill="#e3e3e3"/><circle cx="12" cy="10" r="3.6" fill="#9a9a9a"/><path d="M5.3 19c1.3-3.1 3.6-4.6 6.7-4.6s5.4 1.5 6.7 4.6" fill="#9a9a9a"/></svg>'};

  <div style="position:absolute;top:6px;left:0;width:20%;height:44px;border-radius:24px;background:#dedede;transition:transform .3s cubic-bezier(.3,.8,.3,1);transform:translateX(${idx*100}%) scale(.82);z-index:1"></div>
  ${order.map(cell).join('')}
 </div>`}
function igHome(){let h=`<div style="padding:54px 16px 6px;font-weight:700;font-size:26px">Instagram</div><div style="display:flex;gap:14px;padding:4px 14px 12px;overflow-x:auto">`;
 h+=`<div style="text-align:center;font-size:11px;flex:none"><div style="width:58px;height:58px;border-radius:50%;background:#eee;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:22px;color:#888">+</div>내 스토리</div>`;
 h+=IGDATA.stories.map((s,i)=>`<div style="text-align:center;font-size:11px;flex:none;cursor:pointer" onclick="igOpen(()=>IG.story=${i})"><div style="width:60px;height:60px;border-radius:50%;background:${s[1]?'#3ad37d':'conic-gradient(from 180deg,#f9a03c,#dd2a7b,#8134af,#f9a03c)'};display:flex;align-items:center;justify-content:center;flex:none;margin:0 auto"><div style="width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center"><div style="width:48px;height:48px;border-radius:50%;background:#cfd6e4"></div></div></div>${s[0]}</div>`).join('');
 h+=`</div>`+IGDATA.posts.map((p,i)=>`<div style="border-top:8px solid #f3f3f3"><div class="row" style="border:none"><div class="av">🙂</div><div style="flex:1;font-weight:600">${p[0]}</div></div><div style="height:230px;background:linear-gradient(135deg,#dde3ee,#c8cfe0)"></div><div style="padding:8px 14px 0;display:flex;gap:14px"><span onclick="igLike(${i})" style="cursor:pointer;font-size:21px;color:${IG.liked.has(i)?'#ed4956':'#111'}">${IG.liked.has(i)?'♥':'♡'}</span><span onclick="igOpen(()=>IG.cmt=${i})" style="cursor:pointer;font-size:19px">💬</span></div><div style="padding:4px 14px 14px;font-size:14px"><b>${p[0]}</b> ${p[1]}</div></div>`).join('');
 return `<div class="scr">${h}</div>`}
function igDm(){return `<div class="top">메시지</div><div class="scr">${IGDATA.dms.map((n,i)=>`<div class="row" onclick="igOpen(()=>IG.dm=${i})"><div class="av">🙂</div><div style="flex:1"><div style="font-weight:600">${n}</div><div style="font-size:13px;color:#888">대화를 시작해보세요</div></div></div>`).join('')}</div>`}
function igDmChat(i){return `<div style="padding:56px 14px 10px;font-weight:700;font-size:17px;cursor:pointer" onclick="igOpen(()=>IG.dm=null)">‹ ${IGDATA.dms[i]}</div><div class="scr" style="display:flex;flex-direction:column;padding:0 4px"><div class="bub ot" style="background:#efefef">안녕!</div><div class="bub me" style="background:#3797f0;color:#fff;align-self:flex-end">ㅎㅇㅎㅇ 잘지내?</div></div>`}
function igProfile(){return `<div class="top">jaewonn0619.k</div><div class="scr"><div style="display:flex;align-items:center;gap:26px;padding:0 18px 14px"><div style="width:80px;height:80px;border-radius:50%;background:#dde3ee;flex:none"></div><div style="display:flex;flex:1;justify-content:space-around;text-align:center"><div><b style="font-size:17px">0</b><br><span style="font-size:13px;color:#555">게시물</span></div><div><b style="font-size:17px">283</b><br><span style="font-size:13px;color:#555">팔로워</span></div><div><b style="font-size:17px">240</b><br><span style="font-size:13px;color:#555">팔로잉</span></div></div></div><div style="display:flex;gap:8px;padding:0 18px 14px"><div style="flex:1;background:#efefef;border-radius:8px;padding:7px;text-align:center;font-weight:600;font-size:13px">프로필 편집</div><div style="flex:1;background:#efefef;border-radius:8px;padding:7px;text-align:center;font-weight:600;font-size:13px">프로필 공유</div></div><div style="border-top:1px solid #eee;height:220px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px">게시물 없음</div></div>`}
function igMain(){
 if(IG.story!=null){
  return `<div id="storybox" style="position:absolute;inset:0;overflow:hidden">
   <div onclick="igStoryPrev()" style="position:absolute;top:0;bottom:0;left:0;width:30%;z-index:3"></div>
   <div onclick="igStoryNext()" style="position:absolute;top:0;bottom:0;right:0;width:70%;z-index:3"></div>
   ${igStoryFace(IG.story,true)}
  </div>`}
 let body=IG.dm!=null?igDmChat(IG.dm):IG.tab=='home'?igHome():IG.tab=='dm'?igDm():igProfile();
 let cm='';
 if(IG.cmt!=null){const p=IGDATA.posts[IG.cmt];
  cm=`<div style="position:absolute;inset:0;background:#fff;z-index:9;display:flex;flex-direction:column"><div style="padding:56px 16px 16px;border-bottom:1px solid #eee;font-weight:700;text-align:center;position:relative">댓글<span onclick="igOpen(()=>IG.cmt=null)" style="position:absolute;right:16px;top:56px;cursor:pointer">✕</span></div><div class="scr">${p[2].map(c=>`<div class="row"><div class="av">🙂</div>${c}</div>`).join('')}</div></div>`}
 return `<div style="position:relative;height:100%;display:flex;flex-direction:column">${body}${IG.dm==null&&IG.story==null?igNav():''}${cm}</div>`}

const K={tab:'chat',room:null,coupon:null};
const A={
 phone:()=>`<div class="top">최근 기록</div><div class="scr">${DATA.calls.map(c=>`<div class="row"><div class="av">👤</div><div style="flex:1"><div style="font-size:17px;${c[1]=='부재중'?'color:#ff3b30':''}">${c[0]}</div><div style="font-size:13px;color:#888">${c[1]}</div></div><div style="font-size:14px;color:#888">${c[2]}</div></div>`).join('')}</div>
  <div class="tabs"><div>★<br>즐겨찾기</div><div class="on">🕒<br>최근 기록</div><div>👤<br>연락처</div><div>⌗<br>키패드</div></div>`,
 kakao:()=>{
  if(K.room!=null){const r=DATA.rooms[K.room];
   return `<div style="background:#b2c7d9;flex:1;display:flex;flex-direction:column"><div style="padding:56px 14px 10px;font-weight:700;font-size:17px;cursor:pointer" onclick="go(()=>K.room=null)">‹ ${r.name}</div><div class="scr" style="display:flex;flex-direction:column;padding-bottom:10px">${r.msgs.map(m=>`<div class="bub ${m[0]?'me':'ot'}">${m[1]}</div>`).join('')}</div><div style="background:#fff;padding:10px 14px 30px;color:#aaa;font-size:14px">메시지 입력</div></div>`}
  let body='';
  if(K.tab=='chat')body=`<div class="top">채팅</div><div class="scr">${DATA.rooms.map((r,i)=>`<div class="row" onclick="go(()=>K.room=${i})"><div class="av">🙂</div><div style="flex:1"><div style="font-weight:600">${r.name}</div><div style="font-size:13px;color:#888">${r.msgs.at(-1)[1]}</div></div></div>`).join('')}</div>`;
  else if(K.tab=='friends')body=`<div class="top">친구</div><div class="scr"><div class="row"><div class="av">🙂</div>내 프로필</div></div>`;
  else body=`<div class="top">선물하기</div><div class="scr"><div style="padding:0 18px 4px;font-weight:600">주문내역 · 구매한 기프티콘</div>${DATA.gifts.map((g,i)=>`<div class="card" onclick="go(()=>K.coupon=K.coupon==${i}?null:${i})"><div class="av">${g[0]}</div><div style="flex:1"><div style="font-size:13px;color:#888">${g[1]}</div><div style="font-weight:600">${g[2]}</div><div style="font-size:12px;color:#888">유효기간 ${g[3]}</div>${K.coupon==i?`<div style="margin-top:10px;letter-spacing:3px;font-family:monospace">||| |||| || ||| ||||<br>1234 5678 9012</div>`:''}</div></div>`).join('')}</div>`;
  const t=(k,n,e)=>`<div class="${K.tab==k?'on':''}" onclick="go(()=>K.tab='${k}')">${e}<br>${n}</div>`;
  return body+`<div class="tabs">${t('friends','친구','👤')}${t('chat','채팅','💬')}${t('gift','선물하기','🎁')}</div>`},
 cal:()=>{const y=2026,m=9,first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let c='';
  for(let i=0;i<first;i++)c+='<span></span>';
  for(let d=1;d<=n;d++){const k=`${y}-${m+1}-${String(d).padStart(2,'0')}`;c+=`<span class="${DATA.events[k]?'dot':''} ${d==20?'today':''}">${d==20?'<b>20</b>':d}</span>`}
  return `<div class="top" style="color:#ff3b30">2026년 10월</div><div class="cal" style="color:#888;font-size:13px">${'일월화수목금토'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="cal">${c}</div><div class="scr" style="border-top:1px solid #eee;margin-top:6px">${Object.entries(DATA.events).map(([d,t])=>`<div class="row"><div style="color:#ff3b30;font-weight:600">${d.slice(5)}</div>${t}</div>`).join('')}</div>`},
 insta:()=>igMain()
};
let ap=null,cur=null;
function go(fn){fn();ap.innerHTML=A[cur]()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1500)}
function openApp(id,el){
 if(ap)return;
 if(['msg','music'].includes(id))return;
 if(!A[id])return toast('다음 단계에서 만들어요');
 const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect(),s=p.width/393;
 cur=id;ap=document.createElement('div');ap.className='app';
 ap.style.transformOrigin=`${(r.left+r.width/2-p.left)/s}px ${(r.top+r.height/2-p.top)/s}px`;
 ap.innerHTML=A[id]();phone.appendChild(ap);ap.offsetWidth;ap.classList.add('open');phone.style.setProperty('--sb','#000');
}
function closeApp(){if(!ap)return;const a=ap;ap=null;a.classList.remove('open');phone.style.setProperty('--sb','#fff');setTimeout(()=>a.remove(),350)}
function fit(){const s=Math.min((innerHeight-40)/852,(innerWidth-40)/393,1.3);phone.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
/* ===== 잠금화면 ===== */
const PIN='0205',START=new Date('2026-08-18T11:59:51+09:00'),WALL=''; /* WALL에 배경사진 주소를 넣으면 적용 */
if(WALL)phone.style.setProperty('--wp',`url(${WALL}) center/cover`);
const WIFI='<svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.500 4.500a10 10 0 0114 0M4.300 7.600a6 6 0 018.400 0"/><circle cx="8.500" cy="11" r="1.200" fill="currentColor" stroke="none"/></svg>',SIG='<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.500" width="3" height="6.500" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1" opacity=".4"/></svg>',BAT='<span class="batt"><i style="width:62%"></i><b>62</b></span>';
document.querySelectorAll('.rt').forEach(e=>e.innerHTML=(e.dataset.r=='1'?SIG:'')+WIFI+BAT);
const p2=n=>String(n).padStart(2,'0'),di=$('#di'),lock=$('#lock'),pass=$('#pass');
function tick(){const d=new Date();document.querySelectorAll('.clk').forEach(e=>e.textContent=d.getHours()+':'+p2(d.getMinutes()));
 $('#ldate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
 const s=Math.max(0,Math.floor((d-START)/1000));$('#lcnt').textContent=[Math.floor(s/86400),p2(Math.floor(s%86400/3600)),p2(Math.floor(s%3600/60)),p2(s%60)].join(':')}
setInterval(tick,1000);tick();
let state='lock',code='',busy=false,sy=0,dy=0,drag=false;
const sc=()=>phone.getBoundingClientRect().width/393;
function prog(y){lock.style.transform=`translateY(${-y}px)`;pass.style.setProperty('--p',Math.min(1,y/260))}
lock.addEventListener('pointerdown',e=>{if(state!='lock')return;drag=true;sy=e.clientY;dy=0;lock.setPointerCapture(e.pointerId);lock.style.transition='none'});
lock.addEventListener('pointermove',e=>{if(!drag)return;dy=Math.max(0,(sy-e.clientY)/sc());prog(dy)});
lock.addEventListener('pointerup',e=>{if(!drag)return;drag=false;lock.style.transition='';
 if(dy>110||(dy<8&&e.target.id=='lbar'))openPass();else{lock.style.transform='none';pass.style.setProperty('--p',0)}});
function openPass(){state='pass';lock.style.transform='translateY(-100%)';pass.style.setProperty('--p',1);di.classList.add('wide')}
function closePass(){if(state!='pass'||busy)return;state='lock';code='';dots();lock.style.transform='none';pass.style.setProperty('--p',0);di.classList.remove('wide')}
function dots(){$('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<code.length?'f':''}"></i>`).join('')}
const L=['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
$('#keys').innerHTML=[1,2,3,4,5,6,7,8,9,0].map(n=>`<div class="k" data-n="${n}"${n?'':' style="grid-column:2"'}>${n}${n?`<small>${L[n-1]}</small>`:''}</div>`).join('');
$('#keys').addEventListener('pointerdown',e=>{const k=e.target.closest('.k');if(!k)return;k.classList.add('on');press(k.dataset.n)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>document.querySelectorAll('.k.on').forEach(x=>x.classList.remove('on'))));
document.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))press(e.key)});
function press(n){if(state!='pass'||busy||code.length>=4)return;code+=n;dots();if(code.length==4){busy=true;setTimeout(()=>code==PIN?unlock():wrong(),220)}}
function wrong(){const d=$('#dots');d.classList.add('shake');d.addEventListener('animationend',()=>{d.classList.remove('shake');code='';dots();busy=false},{once:true})}
function unlock(){state='home';phone.classList.add('in');di.classList.remove('wide');pass.style.transition='opacity .45s';pass.style.opacity=0;pass.style.pointerEvents='none';setTimeout(()=>{pass.style.display='none';lock.style.display='none'},500)}
dots();
</script></body></html>
