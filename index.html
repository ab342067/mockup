 return `<div style="position:relative;padding-top:66px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:22px">${IGME}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-top:3px"><path d="M5 9l7 7 7-7"/></svg><svg style="position:absolute;right:19px;top:70px" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H6a3 3 0 00-3 3v11a3 3 0 003 3h11a3 3 0 003-3v-5"/><path d="M18.500 2.500a2.100 2.100 0 013 3L12 15l-4 1 1-4z"/></svg></div>
 <div class="scr" style="padding-bottom:100px"><div style="margin:17px 14px 0;height:44px;border-radius:22px;background:#eff0f3;display:flex;align-items:center;gap:10px;padding:0 14px;color:#737880;font-size:17px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#737880" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>검색</div>

 ${IGDATA.dms.map(row).join('')}</div>`}

function igMain(){
 if(IG.story!=null){

 let body=IG.dm!=null?igDmChat(IG.dm):IG.tab=='home'?igHome():IG.tab=='dm'?igDm():igProfile();
 let cm='';
 if(IG.cmt!=null){const p=IGDATA.posts[IG.cmt];
  cm=`<div style="position:absolute;inset:0;background:#fff;z-index:9;display:flex;flex-direction:column"><div style="padding:56px 16px 16px;border-bottom:1px solid #eee;font-weight:700;text-align:center;position:relative">댓글<span onclick="igOpen(()=>IG.cmt=null)" style="position:absolute;right:16px;top:56px;cursor:pointer">✕</span></div><div class="scr">${p[2].map(c=>`<div class="row">${PF(36)}${c}</div>`).join('')}</div></div>`}
 return `<div style="position:relative;height:100%;display:flex;flex-direction:column">${body}${IG.dm==null&&IG.story==null?igNav():''}${cm}</div>`}

const PH_ARROW={out:'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#8a8a8e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.500 9.500L9.500 2.500M4.500 2.500H9.500V7.500"/></svg>',in:'<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#8a8a8e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.500 2.500L2.500 9.500M2.500 4.500V9.500H7.500"/></svg>'};
function phoneApp(){
 const hs='<svg width="19" height="19" viewBox="0 0 24 24" fill="#2f7df6"><path d="M6.600 10.800c1.400 2.800 3.800 5.100 6.600 6.600l2.200-2.200c.3-.3.7-.4 1-.2 1.100.4 2.300.6 3.600.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.600 21 3 13.400 3 4c0-.6.4-1 1-1h3.500c.6 0 1 .4 1 1 0 1.300.2 2.500.6 3.600.1.300 0 .700-.2 1l-2.300 2.200z"/></svg>';
 const rows=DATA.calls.map(c=>`<div class="pr"><div class="pcr"><div class="pav">${c[0].slice(-2)}</div><div style="margin-left:8px;flex:1;min-width:0"><div style="font-size:17px;line-height:20px;color:${c[4]?'#ff3b30':'#111'}">${c[0]}</div><div style="font-size:16px;line-height:19px;color:#8a8a8e;display:flex;align-items:center;gap:4px">${PH_ARROW[c[1]]}${c[2]}</div></div><div style="font-size:16px;color:#8a8a8e;margin-right:15px">${c[3]}</div><div class="pcb">${hs}</div></div></div>`).join('');
 const hdr=`<div class="phh"><div class="phb" style="left:16px;width:62px;font-size:17px;font-weight:500">편집</div><div style="position:absolute;top:59px;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600">통화</div><div class="phb" style="right:16px;width:44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M6 12h12M9 18h6"/></svg></div></div>`;
 const ti=(x,svg,label,col)=>`<div style="position:absolute;left:${x}px;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:14px;color:${col}"><div style="height:24px;margin-bottom:3px">${svg}</div>${label}</div>`;
 const clock='<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2f7df6"/><path d="M13 6.500V12H8" fill="none" stroke="#fff" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 const person='<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#111"/><circle cx="12" cy="9.500" r="4" fill="#fff"/><path d="M4.500 19.500c1.200-3.300 4-5 7.500-5s6.300 1.700 7.500 5a12 12 0 01-15 0z" fill="#fff"/></svg>';
 const keypad='<svg width="26" height="26" viewBox="0 0 24 24" fill="#111" style="margin-top:-1px">'+[3,9,15,21].map(y=>[4,12,20].map(x=>`<circle cx="${x}" cy="${y}" r="2.600"/>`).join('')).join('')+'</svg>';
 const tab=`<div class="ptab"><div style="position:absolute;left:21px;top:9px;width:281px;height:62px;border-radius:31px;background:#fff;border:1px solid #dcdce0;box-shadow:0 4px 14px rgba(0,0,0,.08);box-sizing:border-box"><div style="position:absolute;left:3px;top:4px;width:97px;height:53px;border-radius:27px;background:#ececee"></div>${ti(53,clock,'통화','#2f7df6')}${ti(140,person,'연락처','#111')}${ti(228,keypad,'키패드','#111')}<div style="position:absolute;left:61px;top:5px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:14px;font-weight:600;line-height:22px;text-align:center;box-sizing:border-box;padding:0 5px">14</div></div><div style="position:absolute;left:310px;top:9px;width:62px;height:62px;border-radius:50%;background:#fff;border:1px solid #dcdce0;box-shadow:0 4px 14px rgba(0,0,0,.08);box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.400" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="6.500"/><path d="M20 20l-4.800-4.800"/></svg></div></div>`;
 return hdr+`<div class="scr pscr">${rows}<div style="height:100px"></div></div>`+tab}
const K={tab:'chat',room:null,coupon:null};
const A={
 phone:()=>phoneApp(),
 kakao:()=>{
  if(K.room!=null){const r=DATA.rooms[K.room];
   return `<div style="background:#b2c7d9;flex:1;display:flex;flex-direction:column"><div style="padding:56px 14px 10px;font-weight:700;font-size:17px;cursor:pointer" onclick="go(()=>K.room=null)">‹ ${r.name}</div><div class="scr" style="display:flex;flex-direction:column;padding-bottom:10px">${r.msgs.map(m=>`<div class="bub ${m[0]?'me':'ot'}">${m[1]}</div>`).join('')}</div><div style="background:#fff;padding:10px 14px 30px;color:#aaa;font-size:14px">메시지 입력</div></div>`}
  let body='';
  if(K.tab=='chat')body=`<div class="top">채팅</div><div class="scr">${DATA.rooms.map((r,i)=>`<div class="row" onclick="go(()=>K.room=${i})"><div class="av">🙂</div><div style="flex:1"><div style="font-weight:600">${r.name}</div><div style="font-size:13px;color:#888">${r.msgs.at(-1)[1]}</div></div></div>`).join('')}</div>`;
  else if(K.tab=='friends')body=`<div class="top">친구</div><div class="scr"><div class="row"><div class="av">🙂</div>내 프로필</div></div>`;
  else body=`<div class="top">선물하기</div><div class="scr"><div style="padding:0 18px 4px;font-weight:600">주문내역 · 구매한 기프티콘</div>${DATA.gifts.map((g,i)=>`<div class="card" onclick="go(()=>K.coupon=K.coupon==${i}?null:${i})"><div class="av">${g[0]}</div><div style="flex:1"><div style="font-size:13px;color:#888">${g[1]}</div><div style="font-weight:600">${g[2]}</div><div style="font-size:12px;color:#888">유효기간 ${g[3]}</div>${K.coupon==i?`<div style="margin-top:10px;letter-spacing:3px;font-family:monospace">||| |||| || ||| ||||<br>1234 5678 9012</div>`:''}</div></div>`).join('')}</div>`;
  const t=(k,n,e)=>`<div class="${K.tab==k?'on':''}" onclick="go(()=>K.tab='${k}')">${e}<br>${n}</div>`;
  return body+`<div class="tabs">${t('friends','친구','👤')}${t('chat','채팅','💬')}${t('gift','선물하기','🎁')}</div>`},
 cal:()=>{const y=2026,m=9,first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),nw=new Date(),TD=(nw.getFullYear()==y&&nw.getMonth()==m)?nw.getDate():0;let c='';
  for(let i=0;i<first;i++)c+='<span></span>';
  for(let d=1;d<=n;d++){const k=`${y}-${m+1}-${String(d).padStart(2,'0')}`;c+=`<span class="${DATA.events[k]?'dot':''} ${d==TD?'today':''}">${d==TD?`<b>${d}</b>`:d}</span>`}
  return `<div class="top" style="color:#ff3b30">2026년 10월</div><div class="cal" style="color:#888;font-size:13px">${'일월화수목금토'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="cal">${c}</div><div class="scr" style="border-top:1px solid #eee;margin-top:6px">${Object.entries(DATA.events).map(([d,t])=>`<div class="row"><div style="color:#ff3b30;font-weight:600">${d.slice(5)}</div>${t}</div>`).join('')}</div>`},
 insta:()=>igMain()
};
let ap=null,cur=null;
function go(fn){fn();ap.innerHTML=A[cur]()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1500)}
function openApp(id,el){
 if(ap)return;
 if(['msg','music','youtube','safari','camera','memo','clock','settings','appstore'].includes(id))return;
 if(!A[id])return toast('다음 단계에서 만들어요');
 const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect(),s=p.width/393;
 cur=id;ap=document.createElement('div');ap.className='app';
 ap.style.transformOrigin=`${(r.left+r.width/2-p.left)/s}px ${(r.top+r.height/2-p.top)/s}px`;
 ap.innerHTML=A[id]();phone.appendChild(ap);ap.offsetWidth;ap.classList.add('open');phone.style.setProperty('--sb','#000');
}
function closeApp(){if(!ap)return;const a=ap;ap=null;a.classList.remove('open');phone.style.setProperty('--sb','#fff');setTimeout(()=>a.remove(),350)}
function fit(){const s=Math.min((innerHeight-40)/852,(innerWidth-40)/393,1.3);phone.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
/* ===== 잠금화면 ===== */
const PIN='0205',START=new Date('2026-08-18T11:59:51+09:00'),WALL=''; /* WALL에 배경사진 주소를 넣으면 적용 */
if(WALL)phone.style.setProperty('--wp',`url(${WALL}) center/cover`);
const WIFI='<svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1.500 4.500a10 10 0 0114 0M4.300 7.600a6 6 0 018.400 0"/><circle cx="8.500" cy="11" r="1.200" fill="currentColor" stroke="none"/></svg>',SIG='<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.500" width="3" height="6.500" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1" opacity=".4"/></svg>',BAT='<span class="batt"><i style="width:62%"></i><b>62</b></span>';
document.querySelectorAll('.rt').forEach(e=>e.innerHTML=(e.dataset.r=='1'?SIG:'')+WIFI+BAT);
const p2=n=>String(n).padStart(2,'0'),di=$('#di'),lock=$('#lock'),pass=$('#pass');
function tick(){const d=new Date();document.querySelectorAll('.calic').forEach(e=>e.innerHTML=calSvg());document.querySelectorAll('.clkic').forEach(e=>e.innerHTML=clockSvg());document.querySelectorAll('.clk').forEach(e=>e.textContent=d.getHours()+':'+p2(d.getMinutes()));
 $('#ldate').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
 const s=Math.max(0,Math.floor((d-START)/1000));$('#lcnt').textContent=[Math.floor(s/86400),p2(Math.floor(s%86400/3600)),p2(Math.floor(s%3600/60)),p2(s%60)].join(':')}
setInterval(tick,1000);tick();
let state='lock',code='',busy=false,sy=0,dy=0,drag=false;
const sc=()=>phone.getBoundingClientRect().width/393;
function prog(y){lock.style.transform=`translateY(${-y}px)`;pass.style.setProperty('--p',Math.min(1,y/260))}
lock.addEventListener('pointerdown',e=>{if(state!='lock')return;drag=true;sy=e.clientY;dy=0;lock.setPointerCapture(e.pointerId);lock.style.transition='none'});
lock.addEventListener('pointermove',e=>{if(!drag)return;dy=Math.max(0,(sy-e.clientY)/sc());prog(dy)});
lock.addEventListener('pointerup',e=>{if(!drag)return;drag=false;lock.style.transition='';
 if(dy>110||(dy<8&&e.target.id=='lbar'))openPass();else{lock.style.transform='none';pass.style.setProperty('--p',0)}});
function openPass(){state='pass';lock.style.transform='translateY(-100%)';pass.style.setProperty('--p',1);di.classList.add('wide')}

function closePass(){
  if(state !== 'pass' || busy) return;

  // 입력한 숫자가 있으면 마지막 숫자 하나 삭제
  if(code.length > 0){
    code = code.slice(0, -1);
    dots();
    return;
  }

  // 입력한 숫자가 없으면 잠금화면 첫 화면으로 돌아가기
  state = 'lock';
  lock.style.transform = 'none';
  pass.style.setProperty('--p', 0);
  di.classList.remove('wide');
}
function dots(){$('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<code.length?'f':''}"></i>`).join('')}
const L=['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
$('#keys').innerHTML=[1,2,3,4,5,6,7,8,9,0].map(n=>`<div class="k" data-n="${n}"${n?'':' style="grid-column:2"'}>${n}${n?`<small>${L[n-1]}</small>`:''}</div>`).join('');
$('#keys').addEventListener('pointerdown',e=>{const k=e.target.closest('.k');if(!k)return;k.classList.add('on');press(k.dataset.n)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>document.querySelectorAll('.k.on').forEach(x=>x.classList.remove('on'))));
document.addEventListener('keydown',e=>{if(/^\d$/.test(e.key))press(e.key)});
function press(n){if(state!='pass'||busy||code.length>=4)return;code+=n;dots();if(code.length==4){busy=true;setTimeout(()=>code==PIN?unlock():wrong(),220)}}
function wrong(){const d=$('#dots');d.classList.add('shake');d.addEventListener('animationend',()=>{d.classList.remove('shake');code='';dots();busy=false},{once:true})}
function unlock(){state='home';phone.classList.add('in');di.classList.remove('wide');pass.style.transition='opacity .45s';pass.style.opacity=0;pass.style.pointerEvents='none';setTimeout(()=>{pass.style.display='none';lock.style.display='none'},500)}
dots();
</script></body></html>
